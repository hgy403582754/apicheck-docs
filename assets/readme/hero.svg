<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">APICheck</title>
  <desc id="desc">AI API 中转站单次检测与服务商参考排行平台：一次检测看清中转站是否可用、模型是否真实、响应是否稳定。</desc>
  <defs>
    <radialGradient id="glow" cx="18%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#13325C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B9EFF"/>
      <stop offset="100%" stop-color="#2DE2C6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0A0E1A"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <!-- Left: title block -->
  <g transform="translate(56 0)">
    <text x="0" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" letter-spacing="1" fill="#2DE2C6">AI API 中转站检测 · 服务商参考排行</text>
    <text x="0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="62" font-weight="800" fill="#E8EEF6">APICheck</text>
    <text x="0" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="500" fill="#C2CEDF">一次检测，看清一个中转站</text>
    <text x="0" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="500" fill="#C2CEDF">能不能用 · 模型是否真实 · 稳不稳</text>

    <circle cx="6" cy="282" r="5" fill="#2DE2C6"/>
    <text x="20" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8FB7FF">apicheck.vip</text>
    <circle cx="240" cy="282" r="5" fill="#3B9EFF"/>
    <text x="254" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#8A9BB5">人工维护服务商排行</text>
  </g>

  <!-- Right: detection report card -->
  <g transform="translate(700 52)">
    <rect width="448" height="256" rx="16" fill="#111A2E" stroke="#223049" stroke-width="1.5"/>
    <path d="M22 30 l5 6 l9 -12" fill="none" stroke="#2DE2C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#E8EEF6">单次检测报告</text>
    <rect x="356" y="20" width="76" height="28" rx="14" fill="#0E3B36" stroke="#1E6B5F"/>
    <text x="394" y="39" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2DE2C6">已完成</text>
    <line x1="22" y1="62" x2="426" y2="62" stroke="#223049" stroke-width="1.5"/>

    <text x="22" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#7E8CA3">端点</text>
    <text x="22" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#7E8CA3">模型</text>
    <text x="22" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#7E8CA3">延迟</text>
    <text x="22" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#7E8CA3">状态</text>

    <text x="92" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D6EA">api.xxx.com/v1</text>
    <text x="92" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D6EA">gpt-4o</text>
    <rect x="328" y="124" width="80" height="26" rx="13" fill="#0E3B36" stroke="#1E6B5F"/>
    <text x="368" y="142" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2DE2C6">✓ 真实</text>

    <text x="92" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D6EA">318 ms</text>
    <rect x="200" y="166" width="210" height="8" rx="4" fill="#1B2740"/>
    <rect x="200" y="166" width="96" height="8" rx="4" fill="#3B9EFF"/>

    <text x="92" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D6EA">连通正常</text>
    <path d="M338 215 l5 6 l9 -12" fill="none" stroke="#37D67A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
